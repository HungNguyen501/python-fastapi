services:
  python_api:
    image: python_api
    container_name: python_api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.api.application:get_app --host 0.0.0.0 --port 8009 --workers 1 --reload
    networks:
      - python_fastapi
    ports:
      - target: 8009
        host_ip: 127.0.0.1
        published: 8009
        protocol: tcp
        mode: host
    healthcheck:
      test: curl --fail http://127.0.0.1:8009/api/v1/health || exit 1
      interval: 2s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:14-3.3
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        published: 5432
        protocol: tcp
        mode: host
    networks:
      - python_fastapi

  redis:
    image: redis
    container_name: redis
    restart: always
    networks:
      - python_fastapi
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - target: 6379
        host_ip: 127.0.0.1
        published: 6379
        protocol: tcp
        mode: host

networks:
  python_fastapi:
    name: python_fastapi
